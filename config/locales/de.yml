  text_time_autopilot_how_2_html: "<b>Du sagst einmal, wohin ein Ordner gehört</b> – auf ein Ticket, auf das Ticket des Monats oder gar nicht. Ausnahmen gehen nach Dateien, Branch oder Stichwort."
  text_time_autopilot_how_3_html: "<b>Ab dann ist die Woche mit einem Klick gebucht</b> – du prüfst die Vorschläge, passt Stunden an und bestätigst."
  text_time_autopilot_self_entry_desc: "Was kein Agent sieht: Telefonate, Meetings, Arbeit ohne Rechner."
